spring.application.name=campushelp-api
# Puerto propio (8082) para poder ejecutarla junto a otros proyectos
server.port=${PORT:8082}

# MongoDB: local por defecto; con MONGODB_URI se puede usar MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/campushelp_db}
spring.data.mongodb.auto-index-creation=true

# Fotografias de evidencia: hasta 10 MB por archivo (una foto de celular pesa 2-6 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# Tomcat lee completas las subidas grandes para poder responder el error 413 en JSON (en vez de cortar la conexion)
server.tomcat.max-swallow-size=60MB

# Documentacion interactiva: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

spring.jackson.serialization.write-dates-as-timestamps=false

# Datos de demostracion (solo si la base esta vacia). Para desactivarlos: APP_DATOS_DEMO=false
app.datos-demo=${APP_DATOS_DEMO:true}
